buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = modGroup
version = modVersion
archivesBaseName = modArchivesBaseName

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: mappingsChannel, version: mappingsVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

apply from: 'dependencies.gradle'

processResources {
    inputs.property "version", project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

sourceSets.main.resources { srcDir 'src/resources' }

mixin {
    add sourceSets.main, "mixins.ercore.refmap.json"
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/maven/**', 'META-INF/*.RSA', 'META-INF/*.SF', 'module-info.class'
    }

    manifest {
        attributes([
                "Specification-Title"     : modArchivesBaseName,
                "Specification-Vendor"    : "Origins_Eternity",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Origins_Eternity",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "ForceLoadAsMod"          : "true",
                "FMLCorePluginContainsFMLMod": "true",
                "FMLCorePlugin"           : "com.origins_eternity.ercore.ERPlugin",
                "TweakClass"              : "org.spongepowered.asm.launch.MixinTweaker"
        ])
    }
}

jar.finalizedBy('reobfJar')